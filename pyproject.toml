[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "computer-tutor"
version = "0.1.0"
description = "A Windows learning HUD and local MCP tools for AI-guided desktop tutorials."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.26,<2",
  "pydantic>=2.11,<3",
  "PySide6-Essentials>=6.8,<7",
  "mss>=10,<11",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
build = ["pyinstaller>=6.12,<7"]

[project.scripts]
computer-tutor = "computer_tutor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/computer_tutor"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
