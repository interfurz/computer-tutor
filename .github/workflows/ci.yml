name: Check and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync pytest -q

  windows-build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          python-version: "3.12"
      - run: uv sync --locked --extra build --extra dev
      - run: uv run --no-sync pyinstaller --noconfirm --clean --onedir --name computer-tutor --collect-all mcp --collect-submodules computer_tutor --manifest packaging/windows.manifest src/computer_tutor/__main__.py
      - name: Verify packaged MCP server
        run: uv run --no-sync pytest -q tests/test_server.py -k real_stdio
        env:
          QT_QPA_PLATFORM: offscreen
          COMPUTER_TUTOR_TEST_EXE: ${{ github.workspace }}\dist\computer-tutor\computer-tutor.exe
      - uses: actions/upload-artifact@v4
        with:
          name: computer-tutor-windows-x64
          path: dist/computer-tutor/
